/* ---------------- render ---------------- */
const deck=document.getElementById('deck');
slides.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.cls||'');
  el.dataset.i=i;
  let foot=(s.foot===false)?'':`<div class="sfoot"><span class="brandmark"><span class="m"></span>ГСК технологии</span><span>${String(i+1).padStart(2,'0')} / 27</span></div>`;
  el.innerHTML=s.html+foot;
  deck.appendChild(el);
});

/* ---------------- chrome & nav ---------------- */
const sections=[...document.querySelectorAll('.slide')];
const ticks=document.getElementById('ticks');
sections.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Слайд '+(i+1));b.onclick=()=>sections[i].scrollIntoView();ticks.appendChild(b);});
const tickBtns=[...ticks.children];
const prog=document.getElementById('prog');
let cur=0;
const io=new IntersectionObserver(es=>{es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');
    cur=+e.target.dataset.i;
    tickBtns.forEach((b,i)=>b.classList.toggle('on',i===cur));
    prog.style.width=((cur+1)/sections.length*100)+'%';
  }})},{threshold:.55});
sections.forEach(s=>io.observe(s));
const go=d=>{const n=Math.max(0,Math.min(sections.length-1,cur+d));sections[n].scrollIntoView();};
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
  if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
  if(e.key==='Home'){e.preventDefault();sections[0].scrollIntoView();}
  if(e.key==='End'){e.preventDefault();sections[sections.length-1].scrollIntoView();}
});
</script>
